<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM Decision</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px}
.card{max-width:420px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h1{text-align:center;margin:0}
p{text-align:center;color:#666;font-size:13px}
label{font-weight:bold;margin-top:12px;display:block}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:16px}
.primary{background:#2563eb;color:#fff}
.dark{background:#111827;color:#fff}
.result{margin-top:16px;padding:14px;border-radius:12px;white-space:pre-line}
.green{background:#dcfce7}
.yellow{background:#fef9c3}
.orange{background:#fed7aa}
.red{background:#fecaca}
textarea{width:100%;height:180px;margin-top:12px;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>RM Decision</h1>
<p>Internal Quality Assistant</p>

<label>Supplier</label>
<input id="supplier" placeholder="พิมพ์ชื่อ Supplier">

<label>Delay Time</label>
<input id="delay" placeholder="เช่น 1:30 ชม.">

<label>pH</label>
<select id="ph">
<option value="A">5 จุด = 6.00–6.50</option>
<option value="B">5 จุด = 5.90–5.99</option>
<option value="C">2 จุด 5.90–5.99 + 3 จุด 5.80–5.89</option>
<option value="D">5 จุด = 5.80–5.89</option>
</select>

<label>กลิ่น</label>
<select id="smell">
<option value="normal">ปกติ</option>
<option value="slight">เปรี้ยวเล็กน้อย / กลิ่นโอ่เล็กน้อย</option>
<option value="bad">เปรี้ยว / กลิ่นโอ่</option>
</select>

<label>รสชาติ</label>
<select id="taste">
<option value="normal">ปกติ</option>
<option value="slight">เปรี้ยวเล็กน้อย</option>
<option value="bad">เปรี้ยว</option>
</select>

<button class="primary" onclick="calculate()">ประมวลผล</button>

<div id="result" class="result yellow">รอการประมวลผล</div>

<button class="dark" onclick="copyText()">📋 คัดลอกข้อความ LINE</button>

<textarea id="output" readonly></textarea>
</div>

<script>
const matrix={
A:{normal:{normal:["🟢","APPROVED","ใช้ได้ปกติ"],slight:["🟢","APPROVED","ใช้ได้ปกติ"],bad:["🟡","CONDITIONAL","ใช้ภายใน 1–2 ชั่วโมง"]},
slight:{normal:["🟡","CONDITIONAL","ใช้ภายใน 1–2 ชั่วโมง"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
bad:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🔴","REJECT","pH ต่ำ และ Sensory ผิดปกติ\nไม่สามารถใช้คั้นได้"],bad:["🔴","REJECT","pH ต่ำ และ Sensory ผิดปกติ\nไม่สามารถใช้คั้นได้"]}},
B:{normal:{normal:["🟡","CONDITIONAL","ใช้ภายใน 1–2 ชั่วโมง"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
slight:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
bad:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🔴","REJECT","pH ต่ำ และ Sensory ผิดปกติ\nไม่สามารถใช้คั้นได้"]}},
C:{normal:{normal:["🟡","CONDITIONAL","ใช้ภายใน 1–2 ชั่วโมง"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
slight:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
bad:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🔴","REJECT","pH ต่ำ และ Sensory ผิดปกติ\nไม่สามารถใช้คั้นได้"]}},
D:{normal:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
slight:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"]},
bad:{normal:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],slight:["🟠","PRIORITY USE","ใช้ภายใน 1 ชั่วโมง / ผสมกับวัตถุดิบปกติ"],bad:["🔴","REJECT","pH ต่ำ และ Sensory ผิดปกติ\nไม่สามารถใช้คั้นได้"]}}
};

const phText={
A:"5 จุด = 6.00–6.50",
B:"5 จุด = 5.90–5.99",
C:"2 จุด 5.90–5.99 + 3 จุด 5.80–5.89",
D:"5 จุด = 5.80–5.89"
};

const smellText={
normal:"ปกติ",
slight:"เปรี้ยวเล็กน้อย / กลิ่นโอ่เล็กน้อย",
bad:"เปรี้ยว / กลิ่นโอ่"
};

const tasteText={
normal:"ปกติ",
slight:"เปรี้ยวเล็กน้อย",
bad:"เปรี้ยว"
};

function calculate(){
const supplier=document.getElementById("supplier").value||"-";
const delay=document.getElementById("delay").value||"-";
const ph=document.getElementById("ph").value;
const smell=document.getElementById("smell").value;
const taste=document.getElementById("taste").value;

const r=matrix[ph][smell][taste];
const emoji=r[0],status=r[1],action=r[2];

const box=document.getElementById("result");
box.className="result";
if(emoji==="🟢") box.classList.add("green");
if(emoji==="🟡") box.classList.add("yellow");
if(emoji==="🟠") box.classList.add("orange");
if(emoji==="🔴") box.classList.add("red");
box.innerHTML="<b>"+emoji+" "+status+"</b><br><br>"+action;

document.getElementById("output").value=
emoji+" RM DECISION\n\n"+
"Supplier : "+supplier+"\n"+
"Delay Time : "+delay+"\n\n"+
"ผลตรวจ\n"+
"• pH : "+phText[ph]+"\n"+
"• กลิ่น : "+smellText[smell]+"\n"+
"• รสชาติ : "+tasteText[taste]+"\n\n"+
"ผลการตัดสิน : "+status+"\n"+
"การปฏิบัติ : "+action;
}

function copyText(){
calculate();
navigator.clipboard.writeText(document.getElementById("output").value);
alert("คัดลอกข้อความเรียบร้อย");
}

calculate();
</script>
</body>
</html>
